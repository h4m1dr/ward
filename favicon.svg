<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="darkBg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#07090f" />
    </radialGradient>
    <linearGradient id="batonWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#241911" />
      <stop offset="35%" stop-color="#4d3727" />
      <stop offset="70%" stop-color="#362519" />
      <stop offset="100%" stop-color="#19110a" />
    </linearGradient>
    <linearGradient id="wrapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e503b" />
      <stop offset="100%" stop-color="#3a271a" />
    </linearGradient>
    <radialGradient id="eyeOrb" cx="42%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffea00" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    <radialGradient id="irisGrad" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffcc00" />
      <stop offset="55%" stop-color="#e65100" />
      <stop offset="100%" stop-color="#5d0c00" />
    </radialGradient>
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes lookAround {
        0%, 100% { transform: translate(0px, 0px); }
        20% { transform: translate(-4px, -1.5px); }
        40% { transform: translate(4.5px, 1px); }
        60% { transform: translate(3px, 3px); }
        80% { transform: translate(-3.5px, 2px); }
      }
      @keyframes eyeAura {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.06); }
      }
      .pupil-target {
        animation: lookAround 6s infinite ease-in-out;
        transform-origin: 64px 36px;
      }
      .aura-glow {
        animation: eyeAura 3s infinite ease-in-out;
        transform-origin: 64px 36px;
      }
    </style>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#darkBg)" />
  <rect width="124" height="124" x="2" y="2" rx="24" fill="none" stroke="#1f2838" stroke-width="1.5" />
  <path d="M 58,122 L 56,86 Q 54,64 45,48 Q 37,34 45,20 Q 53,8 64,8 Q 75,8 83,20 Q 91,34 83,48 Q 74,64 72,86 L 70,122 Z" fill="url(#batonWood)" stroke="#110c07" stroke-width="2" />
  <path d="M 45,46 Q 37,34 45,20 Q 53,8 64,8 Q 75,8 83,20 Q 91,34 83,46 Q 64,56 45,46 Z" fill="#1e140d" opacity="0.6" />
  <path d="M 64,52 L 64,122" stroke="#160e08" stroke-width="2" />
  <path d="M 60,65 L 58,110" stroke="#5a4231" stroke-width="1.2" stroke-linecap="round" />
  <path d="M 68,65 L 70,110" stroke="#22170f" stroke-width="1.5" stroke-linecap="round" />
  <ellipse cx="64" cy="122" rx="8" ry="3.5" fill="#362519" stroke="#110c07" stroke-width="1.5" />
  <path d="M 56,92 Q 64,96 72,93 L 72,97 Q 64,100 56,96 Z" fill="url(#wrapGrad)" stroke="#160e08" stroke-width="0.8" />
  <path d="M 56,102 Q 64,106 72,103 L 72,107 Q 64,110 56,106 Z" fill="url(#wrapGrad)" stroke="#160e08" stroke-width="0.8" />
  <path d="M 57,112 Q 64,115 71,113 L 71,117 Q 64,119 57,116 Z" fill="url(#wrapGrad)" stroke="#160e08" stroke-width="0.8" />
  <ellipse cx="64" cy="36" rx="23" ry="22" fill="#090604" stroke="#2a1d13" stroke-width="2" />
  <circle class="aura-glow" cx="64" cy="36" r="23" fill="#f59e0b" filter="url(#eyeGlow)" />
  <circle cx="64" cy="36" r="19" fill="url(#eyeOrb)" stroke="#92400e" stroke-width="1.2" />
  <g class="pupil-target">
    <circle cx="64" cy="36" r="10.5" fill="url(#irisGrad)" filter="url(#eyeGlow)" />
    <ellipse cx="64" cy="36" rx="3.2" ry="7.8" fill="#050608" />
    <ellipse cx="64" cy="36" rx="1" ry="4" fill="#fff9c4" opacity="0.8" />
    <circle cx="60.5" cy="32" r="2.2" fill="#ffffff" opacity="0.95" />
    <circle cx="66.5" cy="39" r="1.1" fill="#ffffff" opacity="0.6" />
  </g>
  <path d="M 44,38 Q 42,46 50,52 Q 64,57 78,52 Q 86,46 84,38 Q 82,50 64,54 Q 46,50 44,38 Z" fill="#4d3727" stroke="#160e08" stroke-width="1.2" />
</svg>
